<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(4, 4)" filter="url(#glow)">
    <rect width="36" height="36" rx="10" fill="url(#logoGrad)"/>
    <!-- Isometric Cube / Warehouse Rack -->
    <path d="M18 7 L30 14 L18 21 L6 14 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M6 14 L18 21 L18 31 L6 24 Z" fill="#93c5fd" opacity="0.85"/>
    <path d="M18 21 L30 14 L30 24 L18 31 Z" fill="#60a5fa" opacity="0.7"/>
    <!-- Accent Dot -->
    <circle cx="18" cy="14" r="2" fill="#2563eb"/>
  </g>

  <!-- Brand Typography -->
  <text x="48" y="22" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15.5" fill="#f8fafc" letter-spacing="-0.2">SHAM</text>
  <text x="96" y="22" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15.5" fill="#38bdf8" letter-spacing="-0.2">WAREHOUSE</text>
  <text x="49" y="34" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#94a3b8" letter-spacing="1.2">INVENTORY SYSTEM</text>
</svg>
