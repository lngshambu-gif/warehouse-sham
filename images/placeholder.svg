<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="196" height="196" rx="18" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Package Box Icon -->
  <g transform="translate(50, 48)">
    <!-- Back / Top Faces -->
    <path d="M50 8 L92 30 L50 52 L8 30 Z" fill="url(#iconGrad)" opacity="0.9"/>
    <!-- Left Face -->
    <path d="M8 30 L50 52 L50 95 L8 73 Z" fill="url(#iconGrad)" opacity="0.75"/>
    <!-- Right Face -->
    <path d="M50 52 L92 30 L92 73 L50 95 Z" fill="url(#iconGrad)" opacity="0.6"/>
    <!-- Box Flaps / Tape Line -->
    <path d="M50 8 L50 52" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <path d="M29 19 L71 41" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>
  <text x="100" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="0.5">NO IMAGE</text>
</svg>
